name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Leitura do código + escrita de artefatos (evidências de testes).
permissions:
  contents: read
  actions: write

# Um push novo na mesma branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  PNPM_VERSION: 12.8.1

jobs:
  qualidade:
    name: Qualidade, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar estrutura do projeto
        run: pnpm run validate

      - name: Verificar formatação (Prettier)
        run: pnpm run format:check

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Checagem de tipos (TypeScript)
        run: pnpm run typecheck

      - name: Testes automatizados com cobertura
        run: pnpm run test:coverage

      - name: Publicar evidências dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes
          path: |
            coverage/
            test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Build da aplicação
        run: pnpm run build

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Iniciar servidor de desenvolvimento
        run: |
          pnpm run dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
        env:
          PORT: 8080

      - name: Aguardar servidor estar pronto
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz > /dev/null; then
              echo "Servidor pronto"
              exit 0
            fi
            echo "Aguardando servidor... ($i/30)"
            sleep 2
          done
          echo "Logs do dev:"
          cat /tmp/dev.log
          echo "Servidor não ficou pronto"
          exit 1

      - name: Rodar testes E2E
        run: pnpm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Parar servidor de desenvolvimento
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill $(cat /tmp/dev.pid) || true
          fi

      - name: Publicar evidências E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-e2e
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  seguranca:
    name: Verificação de vulnerabilidades
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Relatório informativo: as vulnerabilidades vêm de dependências de terceiros
      # e são acompanhadas no roadmap, por isso não bloqueiam o merge.
      - name: Auditoria das dependências de produção
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
